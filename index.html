<!DOCTYPE html>

<title>WorldRank</title>

<style>
:root{--bg:#eef1fb;--card:#fff;--tx:#161a2b;--mu:#6b7090;--ac:#5b6cff;--ac2:#9b5cff;--bd:#dfe3f0;--gold:#d9a100;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1230;--card:#141c40;--tx:#eef0fa;--mu:#9aa6d0;--ac:#8097ff;--bd:#27315f;--gold:#fbc531;color-scheme:dark}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%}
body{font-family:Poppins,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);transition:background .4s}
main{max-width:480px;margin:0 auto;padding:14px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;transition:transform .12s,opacity .2s}button:active{transform:scale(.96)}
body.home{--card:#141c40;--tx:#eef0fa;--mu:#9aa6d0;--bd:#27315f;--ac:#8097ff;--gold:#fbc531;color:var(--tx);padding-bottom:92px;background:radial-gradient(800px 420px at 0 -5%,#3b4fe0aa,transparent 60%),radial-gradient(600px 420px at 100% 0,#8a2be2aa,transparent 55%),#0b1230 fixed}
body.daily{background:linear-gradient(#5b8fe0,#1f4aa8) fixed;color:#fff}body.weekly{background:linear-gradient(#e0928a,#a8506a) fixed;color:#fff}
body.free{background:linear-gradient(#9b5fc7,#6d3fb3) fixed;color:#fff}body.blitz{background:linear-gradient(#f5a04f,#d4551f) fixed;color:#fff}
body.duel{background:linear-gradient(#3fb8b0,#1f6f8c) fixed;color:#fff}body.foot{background:linear-gradient(#2fb868,#0e6b3a) fixed;color:#fff}
.mu{color:var(--mu);font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.glass{background:#ffffff12;border:1px solid #ffffff1f;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:24px;padding:16px;margin:14px 0;box-shadow:0 8px 30px #0004}
.glass>b.h{letter-spacing:2px;font-size:12px;color:var(--mu)}
.hd{display:flex;justify-content:space-between;align-items:center;padding:4px 2px}
.brand{display:flex;align-items:center;gap:10px}.mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#5b6cff,#9b5cff);display:grid;place-items:center;font-size:24px;box-shadow:0 6px 18px #5b6cff77}
h1{font-size:26px;margin:0;font-weight:800;letter-spacing:-.5px}h1 span{background:linear-gradient(90deg,#8097ff,#c58bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.rg{width:52px;height:52px;border-radius:50%;background:conic-gradient(#8097ff var(--p),#27315f 0);display:grid;place-items:center;position:relative}
.rg::before{content:"";position:absolute;inset:4px;background:#141c40;border-radius:50%}.rg em{position:relative;font-style:normal;font-size:22px}
.rg i{position:absolute;right:-4px;bottom:-4px;background:#fbc531;color:#222;border-radius:10px;font-style:normal;font-size:11px;font-weight:800;padding:1px 6px}
.btn{display:block;width:100%;padding:14px;border-radius:16px;font-weight:700;margin:8px 0;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 8px 20px #5b6cff55}
.btn.s{background:#ffffff14;box-shadow:none;border:1px solid #ffffff26}.btn.l{background:#dbe7ff;color:#14234d;box-shadow:none}
.wk{display:flex;gap:6px;flex:1;justify-content:space-between;margin-left:12px}
.d{width:34px;height:34px;border-radius:50%;border:2px solid #ffffff30;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--mu)}
.d.on{background:linear-gradient(135deg,#5b6cff,#9b5cff);border-color:transparent;color:#fff}.d.td{border-color:#8097ff;color:var(--tx)}
.dq{background:linear-gradient(160deg,#1c2f66,#16224d);border:1px solid #8097ff77;border-radius:20px;padding:14px;margin-top:10px}
.perf{font-size:46px;font-weight:800;color:var(--gold);text-align:right;line-height:1;text-shadow:0 0 20px #fbc53155}
.wkc{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#c97b78,#a8506a);border-radius:20px;padding:14px;margin-top:10px;width:100%;text-align:left;color:#fff}
.wkc>span:first-child{font-size:26px;background:#fff3;border-radius:14px;padding:6px 8px}.wkc div{flex:1;font-size:14px}.wkc small{opacity:.85}
.tg{display:flex;background:#0a1230;border-radius:14px;padding:4px;gap:4px}.tg button{padding:7px 11px;border-radius:10px;color:var(--mu);font-weight:600;font-size:13px}.tg button.on{background:linear-gradient(135deg,#5b6cff,#9b5cff);color:#fff}.tg.wide{margin-bottom:10px}.tg.wide button{flex:1;padding:8px 2px;font-size:12px}
.tls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.tl{background:#ffffff12;border:1px solid #ffffff1a;border-radius:18px;padding:12px 2px;font-size:26px;display:flex;flex-direction:column;align-items:center;gap:2px}.tl small{font-size:12px;font-weight:700}
.tl.on{background:var(--b);border-color:#fff8;box-shadow:0 8px 20px #0005}.tl.pl{border:2px dashed #ffffff30;color:var(--mu)}
.mc{background:#0a1230aa;border-radius:18px;padding:14px}.bar{height:12px;border-radius:8px;background:#1d2a50;margin:10px 0}.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#c68a4b,#f0b46a)}
.go{background:linear-gradient(135deg,#2f5bea,#5b6cff);color:#fff;font-weight:800;border-radius:14px;padding:11px 16px;box-shadow:0 6px 16px #2f5bea66}
.nv{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:460px;margin:0 auto;display:flex;background:#0a1230d9;backdrop-filter:blur(14px);border:1px solid #ffffff1f;border-radius:24px;padding:8px 4px;z-index:5}
.nv button{flex:1;display:flex;flex-direction:column;align-items:center;color:var(--mu)}.nv b{font-size:20px}.nv span{font-size:11px;font-weight:700}.nv .on{color:#fbc531}
.log div{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;border-bottom:1px solid #ffffff14;font-size:14px}.log .me{background:#8097ff22;border-radius:10px}
.av{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.av button{font-size:24px;width:44px;height:44px;border-radius:14px;background:#ffffff12}.av .on{outline:2px solid #8097ff}
.pf{display:flex;align-items:center;gap:14px}.pf .big{font-size:44px;width:70px;height:70px;border-radius:22px;background:linear-gradient(135deg,#5b6cff,#9b5cff);display:grid;place-items:center}
/* game */
.top{display:flex;align-items:center;gap:10px}
.back{width:40px;height:40px;border-radius:50%;background:#fff;color:#222;font-size:20px;flex:none;box-shadow:0 4px 12px #0003}
.lg{width:62px;height:62px;border-radius:18px;background:#ffffff33;display:grid;place-items:center;font-size:34px;position:relative;flex:none;border:1px solid #fff5}
.lg em{position:absolute;bottom:-7px;font-style:normal;font-size:8px;font-weight:800;background:#7b2fe0;border-radius:8px;padding:2px 7px;letter-spacing:.5px}
.tot{flex:1;text-align:center}.tot small{letter-spacing:3px;font-size:11px;opacity:.85}.tot b{display:block;font-size:48px;color:#fbc531;line-height:1.05;text-shadow:0 0 24px #fbc53166}
.dots{display:flex;justify-content:center;gap:6px;align-items:center;font-size:12px}.dots i{width:13px;height:13px;border-radius:50%;background:#ffffff40}.dots i.cur{background:#fff;box-shadow:0 0 8px #fff}
.tools{display:flex;flex-direction:column;gap:6px}.tools button{width:34px;height:34px;border-radius:12px;background:#ffffff33;font-size:16px}
.gc{background:#fff;color:#1b2033;border-radius:30px;padding:14px;margin-top:16px;box-shadow:0 20px 50px #0004}
.cn{background:linear-gradient(#f3f6fd,#e9eefb);border-radius:24px;padding:14px;text-align:center;position:relative}
.cn .f{font-size:68px;line-height:1.1;filter:drop-shadow(0 6px 8px #0003)}.cn .n{font-weight:800;letter-spacing:1px;margin-top:2px}
.pass{position:absolute;right:8px;top:8px;width:62px;background:#fff;border-radius:16px;font-size:10px;font-weight:800;padding:8px 2px;box-shadow:0 6px 14px #0003;color:#222}
.pass b{position:absolute;top:-8px;right:-8px;background:#fbc531;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-size:13px}.pass:disabled{opacity:.35}
.cat{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:#f4f6fa;border-radius:18px;padding:14px;margin-top:9px;font-weight:700;font-size:14px;letter-spacing:.2px;color:#222}
.cat:hover:not(:disabled){background:#e9edfb}.cat.u{color:#fff;background:#c58bdc;border:2px solid #a45bc2}
.daily .cat.u{background:#7fa9ec;border-color:#4d80d6}.weekly .cat.u{background:#e2a6a1;border-color:#c46f76}.blitz .cat.u{background:#f2b07a;border-color:#e0813f}.duel .cat.u{background:#7fcfc7;border-color:#2aa198}.foot .cat.u{background:#6fcf97;border-color:#27a05b}
.pill{display:flex;align-items:center;gap:8px;font-size:22px}.pill b{background:#ffffff66;border-radius:10px;padding:2px 12px;font-size:16px;border-right:5px solid var(--c)}
.tb{height:8px;background:#fff3;border-radius:6px;margin-top:12px}.tb i{display:block;height:100%;width:100%;background:#fbc531;border-radius:6px}
.rv{position:absolute;inset:0;display:grid;place-items:center;font-size:60px;font-weight:900;background:#eef2fbee;border-radius:24px;animation:pop .35s}
@keyframes pop{50%{transform:scale(1.25)}}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.pop,.cat.u.new{animation:pop .4s}
.cf{position:fixed;top:-30px;font-style:normal;font-size:24px;z-index:20;animation:fall 2.4s linear forwards;pointer-events:none}
.gr{display:grid;place-items:center;width:64px;height:64px;border-radius:20px;background:#fbc531;color:#222;font-size:38px;font-weight:900;box-shadow:0 8px 20px #0004}
.ov{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:30;padding:20px}
.md{background:#141c40;color:#eef0fa;border-radius:24px;padding:22px;max-width:380px;border:1px solid #ffffff22}.md h2{margin:0 0 8px}.md p{margin:8px 0;font-size:14px}
.ts{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#000d;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:40;max-width:85%;text-align:center}

body.puzzle{background:linear-gradient(#6a76f2,#2b2f8f) fixed;color:#fff}body.bet{background:linear-gradient(#e6b84a,#b5452f) fixed;color:#fff}
.puzzle .cat.u{background:#a7b0ff;border-color:#6b78e8}.bet .cat.u{background:#f0c27a;border-color:#d98a3d}
.tls{grid-template-columns:repeat(3,1fr)!important}.btn:disabled{opacity:.4}
.rv{display:flex;flex-direction:column;justify-content:center;align-items:center}.rv small{font-size:14px;font-weight:700;color:#222}
.pzg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.chip{background:#eef2fb;border-radius:16px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;color:#222;border:2px solid transparent}
.chip span{font-size:30px}.chip small{font-size:11px;font-weight:700}.chip.sel{border-color:#5b6cff;background:#e0e6ff}.chip.used{opacity:.4}
.bp{padding:6px 2px;color:#222;text-align:center}.bb{display:block;width:100%;padding:13px;border-radius:16px;margin:7px 0;font-weight:800;color:#222}
.bb.g{background:#d6f5e6}.bb.y{background:#fff1c9}.bb.r{background:#fbd9d6}
.wm{position:relative;width:100%;background:#0a1230aa;border-radius:18px;margin:10px 0}
.wt{position:absolute;display:grid;place-items:center;font-size:clamp(11px,3.4vw,17px);border-radius:6px}
.wt.o{opacity:.22;filter:grayscale(1)}.wt.g{box-shadow:0 0 8px #fbc531;background:#fbc53144}.wt.v{background:#2fcf8f44}.wt.s{background:#ffffff22}

 <div class="tls">${tl("free","🎯","linear-gradient(135deg,#7b2fe0,#a45bc2)")}${tl("blitz","⚡","linear-gradient(135deg,#e8782f,#f5a04f)")}${tl("foot","⚽","linear-gradient(135deg,#1f9d57,#2fb868)")}${tl("puzzle","🧩","linear-gradient(135deg,#4f5be0,#7b86ff)")}${tl("bet","🎲","linear-gradient(135deg,#d9822b,#e6b84a)")}<button class="tl pl" onclick="toast(t('soon'))">＋<small>${t("more")}</small></button></div>
 <div class="mc"><div class="row"><div><b style="font-size:19px">${ttl}</b><div class="mu">${sub} · ${t("best")} : ${bm(sel)??"—"}</div></div><button class="go" onclick="${sel==='puzzle'?`start('puzzle','${today()}')`:`start('${sel}')`}">${sel==="puzzle"?t("pzdaily"):t("playb")} ▶</button></div>

function nxt(){const n=new Date(),x=new Date(n);x.setHours(24,0,0,0);const m=Math.floor((x-n)/6e4);return Math.floor(m/60)+"h "+m%60+"min"}
let lbT="d";
async function rangs(){
 const tabs=[["d","today"],["w","week"],["a","alltime"],["f","foot"],["p","puzzle"]],[mode,board]=lbT==="d"?["daily",today()]:lbT==="w"?["weekly",wkey()]:lbT==="a"?["free","all"]:lbT==="p"?["puzzle","P"+today()]:["foot","all"];
 $a.innerHTML=head()+`<div class="glass"><div class="tg wide">${tabs.map(([k,l])=>`<button class="${lbT===k?"on":""}" onclick="lbT='${k}';home('r')">${t(l)}</button>`).join("")}</div><div id="lb" class="log"><span class="mu">…</span></div></div>
 <div class="glass"><b class="h">${t("rec").toUpperCase()}</b><div class="log">${[["📅","daily"],["🏛️","weekly"],["🎯","free"],["⚡","blitz"],["⚽","foot"],["🧩","puzzle"],["🎲","bet"]].map(([i,m])=>{const a=hist().filter(x=>x.m===m).map(x=>x.s);return`<div><span>${i} ${t("m_"+m)}</span><b>${a.length?Math.min(...a):"—"}</b></div>`}).join("")}</div></div>`+nav("r");
 const el=document.getElementById("lb");
 if(!sb){const a=hist().filter(x=>x.m===mode&&(mode!=="daily"||x.d===today())).sort((a,b)=>a.s-b.s).slice(0,10);
  el.innerHTML=`<span class="mu">${t("nob")}</span>`+a.map((x,i)=>`<div class="${i?"":"me"}"><span>${i+1}. ${pav()} ${esc(pname())}</span><b>${x.s}</b></div>`).join("");return}
 try{const rows=await lb(mode,board);if(!document.getElementById("lb"))return;
  el.innerHTML=(ME?"":`<span class="mu">${t("need")}</span>`)+(rows.length?rows.map((r,i)=>`<div class="${ME&&r.user_id===ME.id?"me":""}"><span>${i+1}. ${esc((r.profiles||{}).avatar||"🌍")} ${esc((r.profiles||{}).username||"?")}</span><b>${r.score}</b></div>`).join(""):`<span class="mu">${t("none")}</span>`)}catch(e){el.innerHTML=`<span class="mu">${t("nob")}</span>`}}
function duels(){$a.innerHTML=head()+`<div class="glass"><b class="h">${t("dt")}</b><p class="mu">${t("dp")}</p><button class="btn" onclick="start('duel',Math.random().toString(36).slice(2,7).toUpperCase())">⚔️ ${t("nd")}</button><button class="btn s" onclick="joinDuel()">🔑 ${t("jd")}</button></div>`+nav("d")}
function joinDuel(){const c=(prompt(t("dc"))||"").trim().toUpperCase();if(c)start("duel",c)}
async function pName(){const v=(prompt(t("user"),pname())||"").trim().slice(0,16);if(v.length<2)return;
 if(ME&&sb){await sb.from("profiles").update({username:v}).eq("id",ME.id);ME.username=v}else ls("wr_name",v);home("p")}
async function pAv(a){if(ME&&sb){await sb.from("profiles").update({avatar:a}).eq("id",ME.id);ME.avatar=a}else ls("wr_av",a);home("p")}
function rst(){try{localStorage.clear()}catch(e){}home()}
function profile(){const h=hist(),on=k=>ls(k)!==0,row=(l,k)=>`<div><span>${l}</span><button class="go" onclick="ls('${k}',${on(k)?0:1});home('p')">${on(k)?"ON":"OFF"}</button></div>`,all=h.map(x=>x.s);
 $a.innerHTML=head()+`<div class="glass"><div class="pf"><div class="big">${esc(pav())}</div><div style="flex:1"><b style="font-size:20px">${esc(pname())}</b><div class="mu">${t("lvlw")} ${1+Math.floor(h.length/3)} · ${h.length} ${t("games").toLowerCase()}</div></div><button class="go" onclick="pName()">✏️</button></div>
 <div class="av">${["🌍","⚽","🦊","🐯","🚀","👑","🔥","🧠"].map(a=>`<button class="${pav()===a?"on":""}" onclick="pAv('${a}')">${a}</button>`).join("")}</div>
 ${ME?`<button class="btn s" onclick="logout()">${t("out")}</button>`:`<button class="btn" onclick="login('google')">🟢 ${t("lg")}</button><button class="btn s" onclick="login('apple')">🍎 ${t("la")}</button>${sb?"":`<p class="mu">${t("nob")}</p>`}`}</div>
 <div class="glass"><div class="log">${row("🔊 "+t("snd"),"wr_snd")}${row("📳 "+t("vib"),"wr_vib")}<div><span>🌐 ${t("lang")}</span><div class="tg">${LANGS.map(l=>`<button class="${l===lang?"on":""}" onclick="setLang('${l}');home('p')">${l.toUpperCase()}</button>`).join("")}</div></div></div>
 <button class="btn s" onclick="how()">❓ ${t("howt")}</button><button class="btn s" onclick="if(confirm('?'))rst()">🗑️ ${t("reset")}</button></div>`+nav("p")}
function how(){const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="md"><h2>${t("howt")}</h2><p>1️⃣ ${t("h1")}</p><p>2️⃣ ${t("h2")}</p><p>3️⃣ ${t("h3")}</p><p>4️⃣ ${t("h4")}</p><button class="btn" id="ok">${t("go")}</button></div>`;document.body.appendChild(o);o.querySelector("#ok").onclick=()=>{ls("wr_seen",1);o.remove()}}

function dexAdd(){const d=ls("wr_dex")||{};S.res.forEach(x=>{if(!x)return;const o=d[x.n]||{n:0,f:1};o.n++;o.f=Math.min(o.f,+(x.r/MX).toFixed(3));d[x.n]=o});ls("wr_dex",d)}
function mapScreen(){
 const dex=ls("wr_dex")||{},G=22,Rw=11,used=new Set(),tiles=[],fl={};ALL.concat(FALL).forEach(c=>fl[c[0]]=c[1]);
 Object.keys(fl).forEach(n=>{const ll=LL[n];if(!ll)return;const c0=Math.max(0,Math.min(G-1,Math.round((ll[1]+180)/360*(G-1)))),r0=Math.max(0,Math.min(Rw-1,Math.round((72-ll[0])/125*(Rw-1))));
  for(let d=0;d<4;d++){let ok=0;for(let dr=-d;dr<=d;dr++)for(let dc=-d;dc<=d;dc++){if(ok||Math.max(Math.abs(dr),Math.abs(dc))!==d)continue;const cc=c0+dc,rr=r0+dr;if(cc<0||cc>=G||rr<0||rr>=Rw||used.has(cc+","+rr))continue;used.add(cc+","+rr);tiles.push([n,cc,rr]);ok=1}if(ok)break}});
 const seen=tiles.filter(x=>dex[x[0]]).length,gold=tiles.filter(x=>dex[x[0]]&&dex[x[0]].f<=.08).length;
 $a.innerHTML=head()+`<div class="glass"><b class="h">${t("mapt").toUpperCase()}</b><div class="row" style="margin-top:6px"><span>🌍 <b>${seen}</b>/${tiles.length} ${t("disc")}</span><span>✨ <b>${gold}</b> ${t("mast")}</span></div>
 <div class="bar"><i style="width:${tiles.length?seen/tiles.length*100:0}%"></i></div>
 <div class="wm" style="aspect-ratio:${G}/${Rw}">${tiles.map(([n,c,r])=>{const d=dex[n],k=!d?"o":d.f<=.08?"g":d.f<=.26?"v":"s";return`<div class="wt ${k}" onclick="toast('${esc(nm(n)).replace(/'/g,"")}${d?" · ×"+d.n:""}')" style="left:${c/G*100}%;top:${r/Rw*100}%;width:${100/G}%;height:${100/Rw}%">${fl[n]}</div>`}).join("")}</div><p class="mu">${t("mapd")}</p></div>`+nav("m")}
function drawPz(){
 const asg=S.asg,used=new Set(asg.filter(x=>x!=null)),full=asg.every(x=>x!=null);
 $a.innerHTML=`<div class="top"><button class="back" onclick="home()">←</button><div class="lg"><span>🧩</span><em>${t("m_puzzle")}</em></div><div class="tot"><div style="font-size:13px;opacity:.9">${t("pzhelp")}</div></div><div class="tools"><button onclick="how()">?</button><button onclick="start('puzzle',${S.seed?`'${S.seed}'`:"0"})">↺</button></div></div>
 <div class="gc"><div class="pzg">${S.q.map((ci,k)=>`<button class="chip ${S.sel===k?"sel":""} ${used.has(k)?"used":""}" onclick="pzSel(${k})"><span>${D[ci][1]}</span><small>${esc(nm(D[ci][0]))}</small></button>`).join("")}</div>
 ${S.ord.map(i=>{const k=asg[i];return`<button class="cat ${k!=null?"u":""}" onclick="pzPut(${i})"><span>${cn(CATS[i])}</span><span class="pill">${k!=null?D[S.q[k]][1]+` <small style="font-size:12px">${esc(nm(D[S.q[k]][0]))}</small>`:"＋"}</span></button>`}).join("")}
 <button class="btn" ${full?"":"disabled"} onclick="pzOk()">✅ ${t("validate")}</button></div>`}
function pzSel(k){S.sel=S.sel===k?null:k;drawPz()}
function pzPut(i){if(S.sel!=null){const k=S.sel;S.asg=S.asg.map(x=>x===k?null:x);S.asg[i]=k;S.sel=null}else S.asg[i]=null;drawPz()}
function pzOk(){S.moves=S.q.map(()=>-1);S.dots=[];S.score=0;
 S.ord.forEach(i=>{const k=S.asg[i],c=D[S.q[k]],r=c[2+i];S.res[i]={f:c[1],n:c[0],r};S.moves[k]=i;S.dots.push(r);S.score+=r});end()}
/* ===== jeu ===== */
let AC;function snd(r){if(ls("wr_snd")===0)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type="triangle";o.frequency.value=r<=MX*.08?880:r<=MX*.26?560:220;g.gain.value=.08;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.15)}catch(e){}}
function vib(r){if(ls("wr_vib")!==0)try{navigator.vibrate&&navigator.vibrate(r<=MX*.08?15:r<=MX*.26?[10,30,10]:45)}catch(e){}}
function confetti(){for(let i=0;i<30;i++){const e=document.createElement("i");e.className="cf";e.textContent=["🎉","✨","⭐","⚽"][i%4];e.style.cssText=`left:${Math.random()*100}vw;animation-delay:${Math.random()*.6}s`;document.body.appendChild(e);setTimeout(()=>e.remove(),3300)}}
function start(mode,seed){const b=build(mode,seed);D=b.rows;CATS=b.names;MX=b.mx;S={mode,...b,pos:0,res:Array(8).fill(null),dots:[],moves:[],asg:Array(8).fill(null),sel:null,score:0,joker:b.p,perf:perfect(b.q,b.p)};document.body.className=mode;mode==="puzzle"?drawPz():draw()}
function tick(){clearInterval(S.t);if(S.mode!=="blitz")return;let l=8;const b=document.getElementById("tbar");
 S.t=setInterval(()=>{l-=.1;if(b)b.style.width=l/8*100+"%";if(l<=0){clearInterval(S.t);const f=S.ord.filter(i=>!S.res[i]);toast(t("up"));pick(f[Math.floor(Math.random()*f.length)])}},100)}
function draw(){
 const c=D[S.q[S.pos]],n=S.dots.length;
 $a.innerHTML=`<div class="top"><button class="back" onclick="home()">←</button><div class="lg"><span>${S.mode==="foot"?"⚽":"🌍"}</span><em>${t("m_"+S.mode)}</em></div><div class="tot"><small>${t("total")}</small><b class="${S.rv?"pop":""}">${n?S.score:"–"}</b>
 <div class="dots">${Array.from({length:8},(_,i)=>`<i class="${i===n?"cur":""}" style="${S.dots[i]?`background:${col(S.dots[i])}`:""}"></i>`).join("")}<span style="margin-left:6px">${Math.min(n+1,8)}/8</span></div></div>
 <div class="tools"><button onclick="how()">?</button><button onclick="start('${S.mode}',${S.seed?`'${S.seed}'`:"0"})">↺</button></div></div>
 ${S.mode==="blitz"?'<div class="tb"><i id="tbar"></i></div>':""}
 <div class="gc"><div class="cn"><div class="f">${c[1]}</div><div class="n">${esc(nm(c[0])).toUpperCase()}</div>${S.rv?`<div class="rv" style="color:${col(S.rv)}">#${S.rv}${S.rvm?`<small>${S.rvm}</small>`:""}</div>`:""}
 <button class="pass" ${S.joker<1||S.lock?"disabled":""} onclick="pass()">⏭<br>${t("pass")}<b>${S.joker}</b></button></div>
 ${S.ord.map(i=>{const r=S.res[i];return r?`<div class="cat u ${S.last===i?"new":""}"><span>${cn(CATS[i])}</span><span class="pill">${r.f}<b style="--c:${col(r.r)}">${r.r}</b></span></div>`:`<button class="cat" ${S.lock?"disabled":""} onclick="pick(${i})">${cn(CATS[i])}</button>`}).join("")}</div>`;
 if(S.pend!=null)betUI();else if(!S.rv)tick()}
function pick(i){if(S.lock||S.res[i])return;clearInterval(S.t);if(S.mode==="bet"&&S.pend==null){S.pend=i;return draw()}commit(i,-1)}
function betUI(){const c=D[S.q[S.pos]],i=S.pend,a=Math.round(MX*.08),b=Math.round(MX*.26);document.querySelectorAll(".gc .cat").forEach(e=>e.style.display="none");
 document.querySelector(".gc").insertAdjacentHTML("beforeend",`<div class="bp"><p><b>${t("betq",{c:esc(nm(c[0])),k:cn(CATS[i])})}</b></p><button class="bb g" onclick="commit(${i},0)">🟩 ${t("top")} ≤${a}</button><button class="bb y" onclick="commit(${i},1)">🟨 ${t("mid")} ${a+1}–${b}</button><button class="bb r" onclick="commit(${i},2)">🟥 ${t("low")} >${b}</button><button class="btn s" style="color:#222;border-color:#0002" onclick="commit(${i},-1)">${t("nobet")}</button><button class="back" style="margin:6px auto 0;display:block;border:1px solid #0002" onclick="S.pend=null;draw()">↩</button></div>`)}
function commit(i,bet){if(S.lock||S.res[i])return;clearInterval(S.t);S.pend=null;const G=S,k=S.pos,c=D[S.q[k]],r=c[2+i],bd=r<=MX*.08?0:r<=MX*.26?1:2;
 let pts=r,msg="";if(S.mode==="bet"&&bet>=0){if(bet===bd){pts=Math.max(1,Math.ceil(r/2));msg=t("won")}else{pts=r+10;msg=t("lost")}}
 S.res[i]={f:c[1],n:c[0],r};S.moves[k]=i;S.dots.push(r);S.score+=pts;S.lock=1;S.rv=r;S.rvm=msg;S.last=i;snd(r);vib(r);draw();
 setTimeout(()=>{if(S!==G)return;S.lock=0;S.rv=0;S.rvm="";S.pos++;S.dots.length===8?end():draw()},msg?1200:800)}
function pass(){if(S.lock||S.joker<1)return;S.pend=null;S.joker--;S.moves[S.pos]=-1;S.pos++;draw()}
function end(){
 const d=today(),h=hist();h.push({d,m:S.mode,s:S.score});ls("wr_hist",h.slice(-80));
 if(S.mode==="daily"){const b=ls("wr_best_"+d);if(b==null||S.score<b)ls("wr_best_"+d,S.score);const ds=ls("wr_days")||[];if(!ds.includes(d)){ds.push(d);ls("wr_days",ds.slice(-60))}}
 submit(S.mode,boardOf(),S.score,S.perf);dexAdd();
 const pl=plan(S.q,S.p),ra=S.perf/S.score,g=ra>=.95?0:ra>=.85?1:ra>=.7?2:ra>=.55?3:4,ge="SABCD"[g];
 const tag=S.mode==="daily"?d:S.mode==="duel"?"⚔️ "+S.seed:"("+t("m_"+S.mode).toLowerCase()+")";
 S.share=`WorldRank ${tag} ${S.mode==="foot"?"⚽":"🌍"}${S.p>1?" ("+t("easy").toLowerCase()+")":""}\n${t("sc")} : ${S.score} · ${t("par")} : ${S.perf} · ${t("gd")} ${ge}\n${S.dots.map(sq).join("")}\n${S.mode==="duel"?t("beatd",{c:S.seed}):t("beat")}`;
 const ic=i=>CATS[i].split(" ")[0],cell=(ci,m)=>m===undefined?"—":m<0?"⏭":ic(m)+" "+D[ci][2+m];
 $a.innerHTML=`<div class="top"><button class="back" onclick="home()">←</button><div class="tot"><small>${t("final")}</small><b>${S.score}</b><div style="font-size:13px">${t("perfect")} : ${S.perf} · ${t("gap")} +${S.score-S.perf}</div></div><div class="gr">${ge}</div></div>
 <div class="gc"><div style="text-align:center;font-weight:800;color:#222">${t("g"+g)}${S.mode==="daily"?` · ${t("nextin")} ${nxt()}`:""}</div>
 <div class="log" style="color:#222">${S.ord.map(i=>{const r=S.res[i];return`<div style="border-color:#0001"><span>${r.f} ${esc(nm(r.n))} · ${cn(CATS[i])}</span><b style="color:${col(r.r)}">${r.r}</b></div>`}).join("")}</div>
 <button class="btn s" style="color:#222;border-color:#0002" onclick="document.getElementById('bp').style.display='block';this.remove()">🔍 ${t("bb")}</button>
 <div id="bp" style="display:none;color:#222;font-size:13px"><b>${t("you")} → ${t("ideal")}</b>${S.q.map((ci,k)=>`<div class="row" style="padding:5px 0;border-bottom:1px solid #eee"><span>${D[ci][1]} ${esc(nm(D[ci][0]))}</span><span>${cell(ci,S.moves[k])} → <b>${cell(ci,pl.m[k]<0?-1:pl.m[k])}</b></span></div>`).join("")}</div>
 <button class="btn" id="sh" onclick="share()">📤 ${t("share")}</button>
 <button class="btn s" style="color:#222;border-color:#0002" onclick="start('${S.mode==="daily"||S.mode==="weekly"||S.mode==="duel"?"free":S.mode}')">🎯 ${t("replay")}</button></div>`;
 if(ra>=.85)confetti()}
async function share(){try{if(navigator.share){await navigator.share({text:S.share});return}}catch(e){}
 try{await navigator.clipboard.writeText(S.share);document.getElementById("sh").textContent="✅ "+t("copied")}catch(e){prompt("",S.share)}}
initSB();home();if(!ls("wr_seen"))how();
fetch("data.json").then(r=>r.ok?r.json():null).then(j=>{if(!j||!j.cats||!j.countries||j.cats.length<8)return;
 REAL=j.source!=="demo";ALLC=j.cats.map(c=>c.name);ALL=j.countries.map(c=>{ALT[c.n]={en:c.e,es:c.s};if(c.ll)LL[c.n]=c.ll;return[c.n,c.f,...c.r]});if(!S.mode){home();toast(t("real",{n:ALL.length,c:ALLC.length}))}}).catch(()=>{});
