<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WorldRank</title>
<style>
:root{--bg:#eef1fb;--card:#fff;--tx:#161a2b;--mu:#6b7090;--ac:#3b5bdb;--bd:#dfe3f0;--gold:#d9a100;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#101a3a;--card:#17254d;--tx:#eef0fa;--mu:#9aa6d0;--ac:#7c93ff;--bd:#2a3a6e;--gold:#fbc531;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;transition:background .3s}
body.daily{background:linear-gradient(#5b8fe0,#1f4aa8);color:#fff}
body.free{background:linear-gradient(#9b5fc7,#8d4fbd);color:#fff}
main{max-width:480px;margin:0 auto;padding:14px}
h1{font-size:26px;margin:2px 0}h1 span{color:var(--ac)}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:12px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.btn{display:block;width:100%;padding:14px;border-radius:14px;font-weight:700;margin:8px 0;background:var(--ac);color:#fff}
.btn.s{background:transparent;border:1px solid var(--bd);color:var(--tx)}
.wk{display:flex;justify-content:space-between;margin:8px 0}
.d{width:34px;height:34px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--mu)}
.d.on{background:var(--ac);color:#fff;border-color:var(--ac)}.d.td{border-color:var(--ac);color:var(--tx)}
.perf{font-size:44px;font-weight:800;color:var(--gold);text-align:right;line-height:1}
.log div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd);font-size:15px}
/* game */
.top{display:flex;align-items:center;gap:10px}
.back{width:40px;height:40px;border-radius:50%;background:#fff;color:#222;font-size:20px;flex:none}
.tot{flex:1;text-align:center}.tot small{letter-spacing:3px;font-size:12px;opacity:.8}
.tot b{display:block;font-size:46px;color:#fbc531;line-height:1.1}
.dots{display:flex;justify-content:center;gap:6px;align-items:center;font-size:13px}
.dots i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.25)}
.dots i.cur{background:#fff}
.gc{background:#fff;color:#1b2033;border-radius:26px;padding:14px;margin-top:14px}
.cn{background:#eff2f9;border-radius:22px;padding:12px;text-align:center;position:relative}
.cn .f{font-size:64px;line-height:1.1}.cn .n{font-weight:800;letter-spacing:1px;margin-top:2px}
.pass{position:absolute;right:8px;top:8px;width:64px;background:#fff;border-radius:14px;font-size:11px;font-weight:800;padding:8px 2px;box-shadow:0 4px 12px #0002;color:#222}
.pass b{position:absolute;top:-8px;right:-8px;background:#fbc531;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-size:13px}
.pass:disabled{opacity:.35}
.cat{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:#f4f6f8;border-radius:16px;padding:13px 14px;margin-top:9px;font-weight:800;font-size:15px;letter-spacing:.3px;color:#222}
.cat.u{background:#c58bdc;color:#fff;border:2px solid #a45bc2}
.daily .cat.u{background:#9ec1f2;border-color:#5b8fe0}
.pill{display:flex;align-items:center;gap:8px;font-size:22px}
.pill b{background:rgba(255,255,255,.4);border-radius:10px;padding:2px 12px;font-size:16px;border-right:5px solid var(--c)}
.tools{display:flex;gap:8px}.tools button{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.2);font-size:18px}

body.home{--card:#15264e;--tx:#eef0fa;--mu:#9aa6d0;--ac:#7c93ff;--bd:#2a3a6e;--gold:#fbc531;background:linear-gradient(#22346e,#17234d) fixed;color:var(--tx);min-height:100vh;padding-bottom:84px}
body.weekly{background:linear-gradient(#d98a84,#b05a6b);color:#fff}
body.blitz{background:linear-gradient(#f0954a,#d4602a);color:#fff}
.weekly .cat.u{background:#e7b0ab;border-color:#c46f76}.blitz .cat.u{background:#f6c08f;border-color:#e0813f}
.hd{display:flex;justify-content:space-between;align-items:center}
.rg{width:56px;height:56px;border-radius:50%;background:conic-gradient(var(--ac) var(--p),var(--bd) 0);display:grid;place-items:center;position:relative}
.rg::before{content:"";position:absolute;inset:5px;background:#17234d;border-radius:50%}
.rg small,.rg b{position:relative;line-height:1;text-align:center}.rg small{font-size:7px;letter-spacing:1px;margin-top:8px}.rg b{font-size:20px;margin-top:-14px}
.sec{border:1px solid var(--bd);border-radius:20px;padding:14px;margin:12px 0}
.sec>b{letter-spacing:2px;font-size:13px;color:var(--mu)}
.dq{background:#172a52;border:1px solid var(--ac);border-radius:18px;padding:14px;margin-top:10px}
.wkc{display:flex;align-items:center;gap:12px;background:#bf7470;border-radius:18px;padding:14px;margin-top:10px;width:100%;text-align:left;color:#fff}
.wkc>span:first-child{font-size:28px;background:#fff3;border-radius:12px;padding:6px}.wkc div{flex:1}.wkc small{opacity:.85}
.tg{display:flex;background:#0e1a3d;border-radius:14px;padding:4px;gap:4px}.tg button{padding:8px 12px;border-radius:10px;color:var(--mu);font-weight:600;font-size:14px}.tg button.on{background:#2f5bea;color:#fff}
.tls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.tl{background:#2a3558;border-radius:16px;padding:14px 4px;font-size:26px;display:flex;flex-direction:column;align-items:center;gap:4px}.tl small{font-size:13px;font-weight:700}
.tl.on{outline:3px solid #c9b2ff;background:var(--b)}.tl.pl{background:none;border:2px dashed var(--bd);color:var(--mu)}
.mc{background:#0d1633;border-radius:16px;padding:14px}.bar{height:12px;border-radius:8px;background:#1d2a50;margin:10px 0}.bar i{display:block;height:100%;border-radius:8px;background:#c68a4b}
.go{background:#2f5bea;color:#fff;font-weight:800;border-radius:12px;padding:12px 18px}
.nv{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0b1230;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.nv button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:20px;color:var(--mu)}.nv span{font-size:12px;font-weight:700}.nv .on{color:#fbc531}
.lg{width:62px;height:62px;border-radius:16px;background:#fff3;display:grid;place-items:center;font-size:36px;position:relative;flex:none}
.lg em{position:absolute;bottom:-6px;font-style:normal;font-size:8px;font-weight:800;background:#7b2fe0;border-radius:8px;padding:2px 6px;letter-spacing:.5px}
.tools{flex-direction:column}.tools button{width:34px;height:34px}
.tb{height:8px;background:#fff3;border-radius:6px;margin-top:10px}.tb i{display:block;height:100%;width:100%;background:#fbc531;border-radius:6px}
.ts{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:9;max-width:85%;text-align:center}

body.duel{background:linear-gradient(#3fb8b0,#1f7a8c);color:#fff}.duel .cat.u{background:#8fd6cf;border-color:#2aa198}
@keyframes pop{50%{transform:scale(1.25)}}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.pop{animation:pop .4s}.cat.u.new{animation:pop .4s}
.rv{position:absolute;inset:0;display:grid;place-items:center;font-size:58px;font-weight:900;background:#eff2f9ee;border-radius:22px;animation:pop .35s}
.cf{position:fixed;top:-30px;font-style:normal;font-size:24px;z-index:20;animation:fall 2.4s linear forwards;pointer-events:none}
.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:30;padding:20px}
.md{background:#17254d;color:#eef0fa;border-radius:22px;padding:20px;max-width:380px}.md h2{margin:0 0 8px}.md p{margin:8px 0}
.gr{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:18px;background:#fbc531;color:#222;font-size:38px;font-weight:900}
.cmp div{font-size:13px}.cmp small{color:#667}
</style></head><body><main id="app"></main>

function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

 for(let k=0;k<q.length;k++){const dp=L[k],nd=dp.slice();
  for(let m=0;m<256;m++){if(dp[m]===Infinity)continue;for(let j=0;j<8;j++)if(!(m>>j&1)){const n=m|1<<j;nd[n]=Math.min(nd[n],dp[m]+D[q[k]][2+j])}}

const col=r=>r<=15?"#2fcf8f":r<=50?"#fbb41f":"#ef5350";
const sq=r=>r<=15?"🟩":r<=50?"🟨":"🟥";

 <div class="dq"><div class="mu">📅 Le même plateau pour tous</div><div class="row" style="align-items:flex-end"><div style="font-size:23px;font-weight:800">${best!=null?"Recommencer<br>le défi du jour":"Défi quotidien"}</div><div><div class="mu" style="text-align:right">Score parfait</div><div class="perf">${perf}</div></div></div>
 <p class="mu">${8+p} pays · 8 choix · ${p} passe${p>1?"s":""}${best!=null?` · meilleur : <b>${best}</b><br>⏳ Prochain défi dans ${nxt()}`:""}</p><button class="btn" style="background:#dbe7ff;color:#14234d" onclick="start('daily')">${best!=null?"Recommencer le défi":"Jouer au défi"} ▷</button></div>
 <button class="wkc" onclick="start('weekly')"><span>🏛️</span><div><b>Hebdo</b><br><small>Plateau de la semaine${wb!=null?" · meilleur : "+wb:""}</small><br><small>Semaine ${wkey().split("W")[1]}</small></div><span>▶</span></button></div>
 <div class="sec"><div class="row"><b>JEUX ORIGINAUX</b><div class="tg"><button class="${easy?"":"on"}" onclick="setEasy(0)">🌐 Normal</button><button class="${easy?"on":""}" onclick="setEasy(1)">🌱 Facile</button></div></div>
 <div class="tls">${tl("free","🎯","#7b2fe0")}${tl("blitz","⚡","#e8782f")}<button class="tl pl" onclick="toast('Nouveaux modes : bientôt !')">＋<small>Plus</small></button></div>
 <div class="mc"><div class="row"><div><b style="font-size:20px">${sel==="free"?"Classique":"Éclair"}</b><div class="mu">${sel==="free"?"Plateau aléatoire":"8 secondes par pays"} · meilleur : ${bm(sel)??"—"}</div></div><button class="go" onclick="start('${sel}')">JOUER ▶</button></div>
 <div class="row mu" style="margin-top:8px"><b style="color:#c68a4b">● ${tn}</b></div><div class="bar"><i style="width:${tp}%"></i></div></div></div>
 <p class="mu" style="font-size:12px">${ALL===ALL0?"Mode démo : "+ALL.length+" pays, rangs approximatifs.":ALL.length+" pays · "+ALLC.length+" catégories · données World Bank."}</p>`+nav()}
function start(mode,seed){const b=build(mode,seed);D=b.rows;CATS=b.names;S={mode,...b,pos:0,res:Array(8).fill(null),dots:[],moves:[],score:0,joker:b.p,perf:perfect(b.q,b.p)};document.body.className=mode;draw()}
function nxt(){const n=new Date(),x=new Date(n);x.setHours(24,0,0,0);const m=Math.floor((x-n)/6e4);return Math.floor(m/60)+"h "+m%60+"min"}
let AC;function snd(r){if(ls("wr_snd")===0)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type="triangle";o.frequency.value=r<=15?880:r<=50?560:220;g.gain.value=.08;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.15)}catch(e){}}
function vib(r){if(ls("wr_vib")!==0)try{navigator.vibrate&&navigator.vibrate(r<=15?15:r<=50?[10,30,10]:45)}catch(e){}}
function confetti(){for(let i=0;i<30;i++){const e=document.createElement("i");e.className="cf";e.textContent=["🎉","✨","⭐","🌍"][i%4];e.style.cssText=`left:${Math.random()*100}vw;animation-delay:${Math.random()*.6}s`;document.body.appendChild(e);setTimeout(()=>e.remove(),3300)}}
function how(){const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="md"><h2>Comment jouer ?</h2><p>1️⃣ Un pays apparaît.</p><p>2️⃣ Choisis une catégorie : son <b>rang mondial</b> devient tes points.</p><p>3️⃣ Chaque catégorie ne sert qu'<b>une fois</b> : garde les plus « dures » pour les pays qui y sont mal classés.</p><p>4️⃣ Tu peux <b>passer</b> un pays. Vise le score le plus <b>bas</b> 🎯</p><button class="btn" id="ok">C'est parti</button></div>`;document.body.appendChild(o);o.querySelector("#ok").onclick=()=>{ls("wr_seen",1);o.remove()}}
function duels(head){app.innerHTML=head+`<div class="sec"><b>DUELS ENTRE AMIS</b><p class="mu">Crée un plateau et partage le code : ton ami joue exactement les mêmes pays, puis vous comparez vos scores.</p><button class="btn" onclick="start('duel',Math.random().toString(36).slice(2,7).toUpperCase())">⚔️ Créer un duel</button><button class="btn s" onclick="joinDuel()">🔑 Rejoindre avec un code</button><p class="mu" style="font-size:12px">Jouez avec la même difficulté (Normal / Facile) pour comparer.</p></div>`+nav("d")}
function joinDuel(){const c=(prompt("Code du duel :")||"").trim().toUpperCase();if(c)start("duel",c)}
function rst(){try{localStorage.clear()}catch(e){}home()}
function sets(head){const on=k=>ls(k)!==0,row=(l,k)=>`<div><span>${l}</span><button class="go" onclick="ls('${k}',${on(k)?0:1});home('s')">${on(k)?"Activé":"Coupé"}</button></div>`;
 app.innerHTML=head+`<div class="sec"><b>RÉGLAGES</b><div class="log">${row("🔊 Sons","wr_snd")}${row("📳 Vibrations","wr_vib")}</div><button class="btn s" onclick="how()">❓ Comment jouer</button><button class="btn s" onclick="if(confirm('Effacer toute ta progression ?'))rst()">🗑️ Réinitialiser mes données</button></div>`+nav("s")}
function tick(){clearInterval(S.t);if(S.mode!=="blitz")return;let l=8;const b=document.getElementById("tbar");
 S.t=setInterval(()=>{l-=.1;if(b)b.style.width=l/8*100+"%";if(l<=0){clearInterval(S.t);const f=S.ord.filter(i=>!S.res[i]);toast("Temps écoulé !");pick(f[Math.floor(Math.random()*f.length)])}},100)}
function draw(){
 const c=D[S.q[S.pos]],n=S.dots.length;
 app.innerHTML=`<div class="top"><button class="back" onclick="home()">←</button><div class="lg">🌍<em>${LB[S.mode]}</em></div><div class="tot"><small>TOTAL</small><b class="${S.rv?"pop":""}">${n?S.score:"–"}</b>
 <div class="dots">${Array.from({length:8},(_,i)=>`<i class="${i===n?"cur":""}" style="${S.dots[i]?`background:${col(S.dots[i])}`:""}"></i>`).join("")}<span style="margin-left:6px">${Math.min(n+1,8)}/8</span></div></div>
 <div class="tools"><button onclick="how()">?</button><button onclick="start('${S.mode}',${S.seed?`'${S.seed}'`:"0"})">↺</button></div></div>
 ${S.mode==="blitz"?'<div class="tb"><i id="tbar"></i></div>':""}
 <div class="gc"><div class="cn"><div class="f">${c[1]}</div><div class="n">${c[0].toUpperCase()}</div>${S.rv?`<div class="rv" style="color:${col(S.rv)}">#${S.rv}</div>`:""}
 <button class="pass" ${S.joker<1||S.lock?"disabled":""} onclick="pass()">⏭<br>PASSER<b>${S.joker}</b></button></div>
 ${S.ord.map(i=>{const r=S.res[i];return r?`<div class="cat u ${S.last===i?"new":""}"><span>${CATS[i]}</span><span class="pill">${r.f}<b style="--c:${col(r.r)}">${r.r}</b></span></div>`:`<button class="cat" ${S.lock?"disabled":""} onclick="pick(${i})">${CATS[i]}</button>`}).join("")}</div>`;
 if(!S.rv)tick()}
function pick(i){if(S.lock||S.res[i])return;clearInterval(S.t);const G=S,k=S.pos,c=D[S.q[k]],r=c[2+i];
 S.res[i]={f:c[1],n:c[0],r};S.moves[k]=i;S.dots.push(r);S.score+=r;S.lock=1;S.rv=r;S.last=i;snd(r);vib(r);draw();
 setTimeout(()=>{if(S!==G)return;S.lock=0;S.rv=0;S.pos++;S.dots.length===8?end():draw()},800)}
function pass(){if(S.lock||S.joker<1)return;S.joker--;S.moves[S.pos]=-1;S.pos++;draw()}
function end(){
 const d=today(),h=ls("wr_hist")||[];h.push({d,m:S.mode,s:S.score});ls("wr_hist",h.slice(-50));
 if(S.mode==="daily"){const b=ls("wr_best_"+d);if(b==null||S.score<b)ls("wr_best_"+d,S.score);const ds=ls("wr_days")||[];if(!ds.includes(d)){ds.push(d);ls("wr_days",ds.slice(-60))}}
 const pl=plan(S.q,S.p),ra=S.perf/S.score,g=ra>=.95?["S","Parfait !"]:ra>=.85?["A","Excellent"]:ra>=.7?["B","Très bien"]:ra>=.55?["C","Pas mal"]:["D","À retenter"];
 const tag=S.mode==="daily"?d:S.mode==="duel"?"⚔️ code "+S.seed:"("+LB[S.mode].toLowerCase()+")";
 S.share=`WorldRank ${tag} 🌍${S.p>1?" (facile)":""}\nScore : ${S.score} · parfait : ${S.perf} · note ${g[0]}\n${S.dots.map(sq).join("")}\n${S.mode==="duel"?"Bats-moi avec le code "+S.seed+" !":"Fais mieux !"}`;
 const ic=i=>CATS[i].split(" ")[0],cell=(ci,m)=>m===undefined?"—":m<0?"⏭":ic(m)+" "+D[ci][2+m];
 app.innerHTML=`<div class="top"><button class="back" onclick="home()">←</button><div class="tot"><small>SCORE FINAL</small><b>${S.score}</b><div>Parfait : ${S.perf} · écart +${S.score-S.perf}</div></div><div class="gr">${g[0]}</div></div>
 <div class="gc"><div style="text-align:center;font-weight:800;color:#222">${g[1]}${S.mode==="daily"?` · prochain défi dans ${nxt()}`:""}</div>
 <div class="log" style="color:#222">${S.ord.map(i=>{const r=S.res[i];return`<div><span>${r.f} ${r.n} · ${CATS[i]}</span><b style="color:${col(r.r)}">${r.r}</b></div>`}).join("")}</div>
 <button class="btn s" style="color:#222" onclick="document.getElementById('bp').style.display='block';this.remove()">🔍 Voir le meilleur plateau</button>
 <div id="bp" class="cmp" style="display:none;color:#222"><b>Toi vs idéal</b>${S.q.map((ci,k)=>`<div class="row" style="padding:5px 0;border-bottom:1px solid #eee"><span>${D[ci][1]} ${D[ci][0]}</span><span>${cell(ci,S.moves[k])} <small>→ idéal</small> <b>${cell(ci,pl.m[k]<0?-1:pl.m[k])}</b></span></div>`).join("")}</div>
 <button class="btn" id="sh" onclick="share()">📤 Partager mon score</button>
 <button class="btn s" style="color:#222" onclick="start('${S.mode==="daily"||S.mode==="weekly"||S.mode==="duel"?"free":S.mode}')">🎯 Rejouer</button></div>`;
 if(ra>=.85)confetti()}
async function share(){try{if(navigator.share){await navigator.share({text:S.share});return}}catch(e){}
 try{await navigator.clipboard.writeText(S.share);document.getElementById("sh").textContent="✅ Copié !"}catch(e){prompt("Copie ton score :",S.share)}}
home();if(!ls("wr_seen"))how();
fetch("data.json").then(r=>r.ok?r.json():null).then(j=>{if(!j||!j.cats||!j.countries||j.cats.length<8)return;
 ALLC=j.cats.map(c=>c.name);ALL=j.countries.map(c=>[c.n,c.f,...c.r]);if(!S.mode){home();toast(`Données chargées : ${ALL.length} pays · ${ALLC.length} catégories`)}}).catch(()=>{});
</script></body></html>
